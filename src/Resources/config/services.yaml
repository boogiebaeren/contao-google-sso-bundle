services:
  _defaults:
    autowire: true
    autoconfigure: true


  BoogieBaeren\ContaoGoogleSsoBundle\Controller\:
    resource: '../../Controller'

  
  BoogieBaeren\ContaoGoogleSsoBundle\Controller\LoginController:
    arguments:
      $userProvider: '@contao.security.backend_user_provider'
      $userChecker: '@contao.security.user_checker'

  # Runs after Contao's logout listener (priority 0), which sets the redirect response.
  BoogieBaeren\ContaoGoogleSsoBundle\EventListener\LogoutListener:
    arguments:
      $scopeMatcher: '@contao.routing.scope_matcher'
    tags:
      - { name: kernel.event_listener, priority: -16 }

  google.sso:
    class: Google\Client
    arguments:
      $config:
        client_id: '%env(GOOGLE_SSO_CLIENTID)%'
        client_secret: '%env(GOOGLE_SSO_CLIENTSECRET)%'
  Google\Client: '@google.sso'
